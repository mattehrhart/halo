<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#14161c"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3df2ff"/>
      <stop offset="0.5" stop-color="#7c6bff"/>
      <stop offset="1" stop-color="#ff5fd0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#plate)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- the halo: a tilted ring of light with its glow -->
  <g transform="rotate(-18 64 64)">
    <ellipse cx="64" cy="64" rx="38" ry="27" fill="none" stroke="url(#ring)" stroke-width="12" filter="url(#glow)" opacity="0.85"/>
    <ellipse cx="64" cy="64" rx="38" ry="27" fill="none" stroke="url(#ring)" stroke-width="9"/>
    <ellipse cx="64" cy="62.5" rx="38" ry="27" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2" filter="url(#soft)"/>
  </g>
</svg>

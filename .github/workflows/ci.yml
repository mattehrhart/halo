name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          # Flatpak's sandbox needs unprivileged user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.kde.Sdk//6.11 org.kde.Platform//6.11 org.freedesktop.Sdk.Extension.golang//25.08

      - name: Test
        run: |
          flatpak run --user --command=sh --devel --share=network --filesystem="$PWD" org.kde.Sdk//6.11 -c '
            set -e
            cmake -B build -G Ninja
            cmake --build build
            ctest --test-dir build --output-on-failure'

      - name: Build the Flatpak
        run: |
          flatpak-builder --user --force-clean --repo=repo flatpak-build io.github.mattehrhart.Halo.json
          flatpak build-bundle repo halo.flatpak io.github.mattehrhart.Halo

      - uses: actions/upload-artifact@v4
        with:
          name: halo-flatpak
          path: halo.flatpak

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" halo.flatpak --title "Halo ${GITHUB_REF_NAME#v}" --generate-notes
